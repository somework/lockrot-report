version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: "development"
      preact:
        patterns:
          - "preact"
    ignore:
      # typescript-eslint caps its typescript peer below 7; lift once it allows 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node major in .nvmrc, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
