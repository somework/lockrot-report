name: Release

# A tag vX.Y.Z builds dist/, attests every file, and attaches them to a GitHub release. lockrot
# vendors report.html and manifest.json from that release after `gh attestation verify`. A tag with
# a pre-release suffix (vX.Y.Z-rc.N) publishes a pre-release that is never the Latest release.
# A tag outside main and the release branches, a lockrot pin outside lockrot's main and tags, or a
# red gate of ci.yml stops the release before anything is attested.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      # Full history: the branch check reads every remote branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A tag on another commit would publish an attested page that no reviewed branch holds.
      - name: the tagged commit is on main or a release branch
        run: |
          for branch in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main refs/remotes/origin/release/); do
            git merge-base --is-ancestor "$GITHUB_SHA" "$branch" && exit 0
          done
          echo "::error::$GITHUB_REF_NAME is on neither main nor a release branch"
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # A pin that only a lockrot branch holds can vanish, and the attested page with it.
      - name: the lockrot pin is on lockrot's main or a lockrot tag
        run: node scripts/contract.mjs reachable
      - run: npm ci
      - name: the tag names the version package.json builds
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # The same gates as ci.yml, in its order, all three browsers in one job.
      - run: npm run contract:fetch
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:contract
      - run: npm test
      - run: npm run build
      - run: npx vitest run tests/build
      - name: the build is reproducible
        run: |
          cp -r dist "$RUNNER_TEMP/first"
          npm run build
          diff -r "$RUNNER_TEMP/first" dist
      - run: npx playwright install --with-deps chromium firefox webkit
      # Pinned so the layout budgets measure the same fonts as ci.yml.
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: node scripts/pages.mjs
      - run: npx playwright test
        env:
          CI: "true"
      - name: release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/report.html
            dist/lockrot-report.js
            dist/lockrot-report.css
            dist/manifest.json
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel=()
          case "$GITHUB_REF_NAME" in
            *-*) channel=(--prerelease --latest=false) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            dist/report.html dist/lockrot-report.js dist/lockrot-report.css dist/manifest.json \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            "${channel[@]}"
